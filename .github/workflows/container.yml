name: Container

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - src/**
      - .github/workflows/container.yml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Construire l'image
        run: docker build -t flux-lab:ci .
      - name: Vérifier que le conteneur ne tourne pas en root
        run: test "$(docker run --rm --entrypoint id flux-lab:ci -u)" != "0"
      - name: Analyser l'image (failles connues)
        run: |
          docker pull python:3.9.2-slim
          docker save python:3.9.2-slim -o "$RUNNER_TEMP/image.tar"
          docker run --rm -v "$RUNNER_TEMP/image.tar:/image.tar:ro" \
            ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --input /image.tar --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed
      - name: Test de fumée du conteneur
        run: |
          docker run -d --name flux -p 8000:8000 flux-lab:ci
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/ready
          curl -sf -o /dev/null -w "%{http_code}\n" -X POST http://127.0.0.1:8000/messages \
            -H "Content-Type: application/json" \
            -d '{"id":"ci-1","type":"commande","payload":{}}' | grep -q 202
          docker rm -f flux

