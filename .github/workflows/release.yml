name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.12.23"
      - name: Vérifier que le tag correspond à la version du projet
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(uv version --short)" = "$TAG"
      - run: uv build
      - run: bash scripts/smoke.sh dist/*.whl
      - name: Générer le SBOM
        run: uv export --format cyclonedx1.5 --locked --no-dev --preview-features sbom-export -o dist/sbom.cdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist/
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
  image:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/alexis-krieger/projet-flux-lab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Construire l'image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$IMAGE:$TAG" .
      - name: Analyser l'image (failles connues)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker save "$IMAGE:$TAG" -o "$RUNNER_TEMP/image.tar"
          docker run --rm -v "$RUNNER_TEMP/image.tar:/image.tar:ro" \
            ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --input /image.tar --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed
      - name: Publier l'image
        id: push
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$TAG"
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ghcr.io/alexis-krieger/projet-flux-lab
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
